<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李旻泽 · 家庭相册</title>
  <link rel="stylesheet" href="css/lightbox.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #fdf6ee 0%, #f7efe4 50%, #f2e8da 100%);
      color: #4a3f35;
      min-height: 100vh;
    }

    /* ===== 密码验证遮罩层 ===== */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fdf6ee 0%, #efe2cf 100%);
    }
    .gate-card {
      width: min(90vw, 360px);
      background: #fff;
      border-radius: 18px;
      padding: 38px 30px 32px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(74, 63, 53, 0.20);
    }
    .gate-card h2 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #3d3229;
      margin-bottom: 6px;
    }
    .gate-card .sub {
      font-size: 0.85rem;
      color: #9a8a77;
      margin-bottom: 22px;
    }
    .gate-card input {
      width: 100%;
      padding: 13px 16px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.18em;
      border: 1.5px solid #e2d4be;
      border-radius: 10px;
      outline: none;
      color: #4a3f35;
      transition: border-color 0.2s ease;
    }
    .gate-card input:focus { border-color: #c9a86a; }
    .gate-card button {
      width: 100%;
      margin-top: 16px;
      padding: 13px 0;
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: #fff;
      background: #c9a86a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .gate-card button:hover { background: #b8965a; }
    .gate-err {
      min-height: 18px;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #c0392b;
      letter-spacing: 0.04em;
    }

    /* ===== 相册内容（验证前隐藏） ===== */
    #content { display: none; }
    #content.unlocked { display: block; }

    header {
      text-align: center;
      padding: 56px 20px 28px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #3d3229;
    }
    header .divider {
      width: 56px; height: 3px;
      background: #c9a86a;
      margin: 18px auto;
      border-radius: 2px;
    }
    header p {
      font-size: 0.95rem;
      color: #8a7a68;
      letter-spacing: 0.06em;
    }

    /* ===== 瀑布流布局 ===== */
    .gallery {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 22px 56px;
      column-width: 460px;   /* 宽屏约 2 列，窄屏自动降为 1 列 */
      column-gap: 20px;
    }
    .gallery a {
      display: block;
      width: 100%;
      margin: 0 0 20px;        /* 照片之间留空隙 */
      break-inside: avoid;     /* 防止卡片被分栏截断 */
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 20px rgba(74, 63, 53, 0.12);
      transition: transform 0.32s ease, box-shadow 0.32s ease;
    }
    .gallery a:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(74, 63, 53, 0.22);
    }
    .gallery img {
      width: 100%;
      height: auto;            /* 保留原始比例，不再裁切 */
      display: block;
      transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    .gallery a:hover img {
      transform: scale(1.06);  /* 悬停时照片微微放大 */
    }
    /* 悬停标题 */
    .gallery .cap {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 26px 18px 16px;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      color: #fff;
      background: linear-gradient(to top, rgba(61, 50, 41, 0.78), rgba(61, 50, 41, 0));
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.32s ease, transform 0.32s ease;
      pointer-events: none;
    }
    .gallery a:hover .cap {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 24px 20px 40px;
      font-size: 0.82rem;
      color: #a49482;
      letter-spacing: 0.05em;
    }

    @media (max-width: 560px) {
      .gallery { column-width: auto; column-count: 1; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <!-- 密码验证遮罩层 -->
  <div id="gate">
    <div class="gate-card">
      <h2>家庭相册</h2>
      <div class="sub">请输入访问密码</div>
      <input id="pwd" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" autofocus>
      <button id="enter">进 入</button>
      <div class="gate-err" id="err"></div>
    </div>
  </div>

  <!-- 相册内容 -->
  <div id="content">
    <header>
      <h1>李旻泽 · 家庭相册</h1>
      <div class="divider"></div>
      <p>初修片精选 · 2023 年冬</p>
    </header>

    <div class="gallery">
      <a href="photos/JN5D9730.jpg" data-lightbox="family" data-title="小牛仔与马 · 户外">
        <img src="photos/JN5D9730.jpg" alt="小牛仔与马">
        <span class="cap">小牛仔与马 · 户外</span>
      </a>
      <a href="photos/JN5D9668.jpg" data-lightbox="family" data-title="墨镜大笑 · 棚拍">
        <img src="photos/JN5D9668.jpg" alt="墨镜大笑">
        <span class="cap">墨镜大笑 · 棚拍</span>
      </a>
      <a href="photos/DSC_7570.jpg" data-lightbox="family" data-title="抱着相册的孩子">
        <img src="photos/DSC_7570.jpg" alt="抱着相册的孩子">
        <span class="cap">抱着相册的孩子</span>
      </a>
      <a href="photos/DSC_7531.jpg" data-lightbox="family" data-title="彩色墙前的托腮">
        <img src="photos/DSC_7531.jpg" alt="彩色墙前的托腮">
        <span class="cap">彩色墙前的托腮</span>
      </a>
    </div>

    <footer>Family Album · 点击照片可放大，手机端可左右滑动切换</footer>
  </div>

  <script>
    (function () {
      var PASSWORD = "1024";
      var gate = document.getElementById("gate");
      var content = document.getElementById("content");
      var input = document.getElementById("pwd");
      var err = document.getElementById("err");

      function unlock() {
        if (input.value === PASSWORD) {
          gate.style.display = "none";
          content.classList.add("unlocked");
          err.textContent = "";
          input.value = "";
        } else {
          err.textContent = "密码错误，请重新输入";
          input.value = "";
          input.focus();
        }
      }

      document.getElementById("enter").addEventListener("click", unlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); unlock(); }
      });
      input.focus();
    })();
  </script>

  <script src="js/jquery.min.js"></script>
  <script src="js/lightbox.min.js"></script>
  <script>
    lightbox.option({
      resizeDuration: 200,
      wrapAround: true,
      albumLabel: "第 %1 张 / 共 %2 张"
    });

    /* 移动端：在 Lightbox 大图查看模式下，左右滑动切换上一张 / 下一张 */
    (function () {
      var startX = null, startY = null, swiping = false;

      function lightboxOpen() {
        var lb = document.querySelector(".lightbox");
        return lb && getComputedStyle(lb).display !== "none";
      }
      function visible(el) {
        return el && el.offsetParent !== null;
      }

      document.addEventListener("touchstart", function (e) {
        if (!lightboxOpen()) return;
        var t = e.touches[0];
        startX = t.clientX; startY = t.clientY; swiping = true;
      }, { passive: true });

      document.addEventListener("touchend", function (e) {
        if (!swiping || startX === null) return;
        swiping = false;
        var t = e.changedTouches[0];
        var dx = t.clientX - startX;
        var dy = t.clientY - startY;
        startX = startY = null;
        if (!lightboxOpen()) return;
        // 仅当横向滑动明显大于纵向时才切换，避免误触
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          if (e.cancelable) e.preventDefault();
          var btn = document.querySelector(dx < 0 ? ".lb-next" : ".lb-prev");
          if (visible(btn)) btn.click();
        }
      });
    })();
  </script>
</body>
</html>
